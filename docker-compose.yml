version: '3.8'

services:
  clipwise:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - clipwise_data:/data
    environment:
      - CLIPWISE_WHISPER_MODEL=base
      - CLIPWISE_DATA_DIR=/data
      - CLIPWISE_PASSWORD=${CLIPWISE_PASSWORD:-}
      - MAX_UPLOAD_SIZE_MB=500
      - ORIGINALS_TTL_DAYS=7
      - DEFAULT_CAPTION_COLOR=#FFD700
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  clipwise_data:
